    a:1.00000261, da:0.00000562, e:0.01671123, de:-0.00004392,

  { name:"Mars", tex:"marsmap1k.jpg", color:0xd87050, size:0.040, axialTilt:25.19, rotPeriod:1.03,

  { name:"Jupiter", tex:"jupitermap.jpg", color:0xd4a574, size:0.14, axialTilt:3.13, rotPeriod:0.41,
    a:5.20288700, da:-0.00011607, e:0.04838624, de:-0.00013253,
    I:1.30439695, dI:-0.00183714, L:34.39644051, dL:3034.74612775,

  { name:"Saturn", tex:"saturnmap.jpg", color:0xe5c880, size:0.12, axialTilt:26.73, rotPeriod:0.44,
    a:9.53667594, da:-0.00125060, e:0.05386179, de:-0.00050991,
    I:2.48599187, dI:0.00193609, L:49.95424423, dL:1222.49362201,

// ===== Keplerian math =====
const DEG = Math.PI / 180;

function solveKepler(M, e) {
  let E = M + e * Math.sin(M);
  for (let k = 0; k < 50; k++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-12) break;
  }
  return E;
}

function keplerianPosition(a, e, iDeg, omDeg, wDeg, MDeg) {
  const M = ((MDeg % 360) + 360) % 360 * DEG;
  const E = solveKepler(M, e);
  const nu = 2 * Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  const r = a * (1 - e * Math.cos(E));
  const xo = r * Math.cos(nu);
  const yo = r * Math.sin(nu);
  const cw = Math.cos(wDeg*DEG), sw = Math.sin(wDeg*DEG);
  const cO = Math.cos(omDeg*DEG), sO = Math.sin(omDeg*DEG);
  const cI = Math.cos(iDeg*DEG), sI = Math.sin(iDeg*DEG);
  const x = (cw*cO - sw*sO*cI)*xo + (-sw*cO - cw*sO*cI)*yo;
  const y = (cw*sO + sw*cO*cI)*xo + (-sw*sO + cw*cO*cI)*yo;
  const z = (sw*sI)*xo + (cw*sI)*yo;
  return { x, y, z, r };
}

function planetPosition(p, JD) {
  const T = (JD - 2451545.0) / 36525.0;
  const a = p.a + p.da*T, e = p.e + p.de*T, I = p.I + p.dI*T;
  const L = p.L + p.dL*T, wbar = p.wbar + p.dwbar*T, Om = p.Om + p.dOm*T;
  return keplerianPosition(a, e, I, Om, wbar - Om, L - wbar);
}

function asteroidPosition(JD) {
  const n = 360 / asteroid.period;
  return keplerianPosition(asteroid.a, asteroid.e, asteroid.i, asteroid.om, asteroid.w,
                           asteroid.M0 + n * (JD - asteroid.epoch));
}

const nowJD = () => Date.now() / 86400000 + 2440587.5;
const jdToDate = jd => new Date((jd - 2440587.5) * 86400000);
const formatDate = d => d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
const ecl2three = p => new THREE.Vector3(p.x, p.z, -p.y);

// ===== Three.js scene =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 5000);
const DEFAULT_CAM = new THREE.Vector3(0, 2.6, 5.8);
camera.position.copy(DEFAULT_CAM);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.3;
controls.maxDistance = 80;

// (Bloom post-processing removed — no glow on sun/asteroid/label)

// ===== Texture loader w/ fallback =====
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const TEXTURE_BASE = "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/";

function loadTexture(filename, onReady) {
  loader.load(TEXTURE_BASE + filename,
    tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      onReady?.(tex);
    },
    undefined,
    err => console.warn("Texture failed:", filename, err)
  );
}

// ===== Starfield (dense, varied) =====
{
  const N = 9000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 500 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const bright = 0.3 + Math.pow(Math.random(), 3) * 0.9;
    const tint = Math.random();
    if (tint < 0.1) { col[i*3+0] = bright; col[i*3+1] = bright*0.85; col[i*3+2] = bright*0.7; }
    else if (tint < 0.2) { col[i*3+0] = bright*0.75; col[i*3+1] = bright*0.85; col[i*3+2] = bright; }
    else { col[i*3+0] = bright; col[i*3+1] = bright; col[i*3+2] = bright; }
    siz[i] = Math.random() < 0.95 ? 1.0 : 2.5;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 1.2, sizeAttenuation: false, transparent: true, opacity: 0.95, vertexColors: true });
  scene.add(new THREE.Points(geo, mat));
}

// ===== Sun =====

// ===== Orbit curves =====
function orbitCurve(a, e, i, om, w, color, segments = 360, opacity = 0.35) {
  const pts = [];
  for (let k = 0; k <= segments; k++) {
    pts.push(ecl2three(keplerianPosition(a, e, i, om, w, (k/segments)*360)));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
}

// ===== Saturn rings (procedural, banded) =====
function makeSaturnRings(innerR, outerR) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 8;
  const ctx = c.getContext('2d');
  for (let x = 0; x < c.width; x++) {
    const t = x / c.width;
    const base = 0.55 + 0.4 * (1 - Math.abs(t - 0.45) * 1.8);
    const band = Math.sin(x * 0.09) * 0.12 + Math.sin(x * 0.035) * 0.18 + Math.sin(x * 0.25) * 0.06;
    const lum = Math.max(0.05, Math.min(1, base + band));
    const r = Math.floor(230 * lum);
    const g = Math.floor(205 * lum);
    const b = Math.floor(150 * lum);
    // Thin dark gap around Cassini-like division
    const gap = (t > 0.62 && t < 0.66) ? 0.1 : 1.0;
    const alpha = Math.min(1, 0.85 * lum) * gap;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
    ctx.fillRect(x, 0, 1, c.height);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

  const geo = new THREE.RingGeometry(innerR, outerR, 128, 1);
  // Remap UVs so u goes 0→1 from inner edge to outer edge radially
  const posAttr = geo.attributes.position;
  const uvAttr = geo.attributes.uv;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i), y = posAttr.getY(i);
    const r = Math.sqrt(x*x + y*y);
    uvAttr.setXY(i, (r - innerR) / (outerR - innerR), 0.5);
  }
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = Math.PI / 2;  // RingGeometry is in XY plane; tilt into ecliptic
  return ring;
}

// ===== Planets (orbits, meshes, rotation, optional clouds/rings) =====
const planetMeshes = [];
for (const p of planets) {
  const w = p.wbar - p.Om;
  scene.add(orbitCurve(p.a, p.e, p.I, p.Om, w, p.color, 256, 0.28));

  const mat = new THREE.MeshStandardMaterial({
    color: p.color, roughness: 0.95, metalness: 0.0, emissive: 0x000000
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 40, 40), mat);

  // Carrier group so axial tilt + self-rotation compose cleanly
  const carrier = new THREE.Group();
  carrier.rotation.z = p.axialTilt * DEG;
  carrier.add(mesh);
  scene.add(carrier);

  let clouds = null;
  if (p.clouds) {
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, transparent: true, opacity: 0.45, depthWrite: false
    });
    clouds = new THREE.Mesh(new THREE.SphereGeometry(p.size * 1.015, 40, 40), cloudMat);
    carrier.add(clouds);
    loadTexture(p.clouds, tex => {
      cloudMat.map = tex;
      cloudMat.alphaMap = tex;
      cloudMat.needsUpdate = true;
    });
  }

  let rings = null;
  if (p.rings) {
    rings = makeSaturnRings(p.size + p.rings.inner, p.size + p.rings.outer);
    carrier.add(rings);
  }

  loadTexture(p.tex, tex => {
    mat.map = tex;
    mat.color.set(0xffffff);
    mat.needsUpdate = true;
  });

  planetMeshes.push({ p, carrier, mesh, clouds, rings });
}

// ===== Asteroid: lumpy icosahedron =====
function makeAsteroidGeometry(baseR, detail) {
  const geo = new THREE.IcosahedronGeometry(baseR, detail);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n =
      0.78 +
      Math.sin(x * 9 + 1) * Math.cos(y * 7 + 2) * 0.10 +
      Math.sin(y * 11) * Math.cos(z * 6) * 0.08 +
      Math.sin(z * 13 + 3) * 0.06 +
      (Math.random() - 0.5) * 0.04;
    pos.setXYZ(i, x * n / baseR * baseR, y * n / baseR * baseR, z * n / baseR * baseR);
    // Equivalent but simpler: scale each vertex
    pos.setXYZ(i, x * n, y * n, z * n);
  }
  geo.computeVertexNormals();
  return geo;
}

  $speedVal.textContent = speedLabels[speedIdx];
  if (speedIdx === 0 && playing) { playing = false; $play.textContent = '▶ Play'; }
  else if (speedIdx !== 0 && !playing) { playing = true; $play.textContent = '⏸ Pause'; }
});
$speedVal.textContent = speedLabels[speedIdx];

// ===== Animation loop =====
let lastT = performance.now();
function update(tNow) {
  const dt = (tNow - lastT) / 1000;
  lastT = tNow;
  if (playing) simJD += speedLevels[speedIdx] * dt;

  // Planet orbital + self-rotation
  for (const { p, carrier, mesh, clouds } of planetMeshes) {
    carrier.position.copy(ecl2three(planetPosition(p, simJD)));
    const spin = (simJD / p.rotPeriod) * Math.PI * 2;
    mesh.rotation.y = spin;
    if (clouds) clouds.rotation.y = spin * 1.1;
  }

  // Sun slow rotation
  sun.rotation.y = tNow * 0.00008;

  // Asteroid
  const aPos = asteroidPosition(simJD);
  const v = ecl2three(aPos);
  astMesh.position.copy(v);
  astLabel.position.set(v.x, v.y + 0.22, v.z);
  astMesh.rotation.x = tNow * 0.0006;
  astMesh.rotation.y = tNow * 0.0009;

  // UI
  $date.textContent = formatDate(jdToDate(simJD));
  $distance.textContent = aPos.r.toFixed(3) + ' au';
  let peri = asteroid.tp;
  while (peri < simJD) peri += asteroid.period;
  $peri.textContent = formatDate(jdToDate(peri));

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(update);
}
requestAnimationFrame(update);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
